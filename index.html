<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wait… Is That True? — Humboldt Youth Quiz</title><style>:root{font-family:Arial,sans-serif;color:#fff;background:#111a3a}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1400px;margin:auto}h1{font-size:clamp(32px,5vw,66px);margin:10px 0}p{font-size:22px}button{cursor:pointer;font:inherit;border:0;border-radius:12px;padding:16px}button:focus-visible{outline:4px solid #ffda6a}header{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.cat{font-size:clamp(17px,2.3vw,30px);font-weight:bold;text-align:center;padding:20px 8px;border-radius:12px}.cat:nth-child(1){background:#ef6c75}.cat:nth-child(2){background:#8655db}.cat:nth-child(3){background:#008f93}.cat:nth-child(4){background:#b47b00}.tile{font-size:clamp(26px,4vw,52px);font-weight:bold;background:#fff8e8;color:#111a3a;min-height:110px}.tile:disabled{opacity:.25}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar button,.actions button{background:#f9d45d;color:#111a3a;font-weight:bold}.scores{display:flex;gap:16px;font-size:25px}.score{background:#243057;border-radius:14px;padding:12px}.score button{padding:4px 10px}.overlay{position:fixed;inset:0;background:#0b1230ee;display:none;overflow:auto;padding:22px;z-index:10}.overlay.open{display:block}.panel{max-width:1100px;margin:0 auto}.pill{font-size:24px;color:#ffe17d}.question{font-size:clamp(30px,4.4vw,58px);line-height:1.14;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{font-size:clamp(20px,2.4vw,32px);min-height:105px;text-align:left;background:#f8f4eb;color:#111a3a}.option.selected{outline:5px solid #f8d24e}.option.correct{background:#8be4b2}.option.wrong{background:#ffb0a7}.answer{font-size:clamp(21px,2.5vw,32px);background:#243057;border-radius:12px;padding:18px;margin-top:18px}.hidden{display:none}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.source{font-size:19px;margin-top:12px}.source a{color:#ffe17d}footer{font-size:17px;color:#e0e4f2;margin-top:20px}@media(max-width:650px){.options{grid-template-columns:1fr}.tile{min-height:76px}.scores{flex-wrap:wrap}}</style></head><body><header><div><h1>WAIT… IS THAT TRUE?</h1><p>Humboldt Youth · Facts, Myths & Risky Choices</p></div><div class="scores"><div class="score">Team 1 <button onclick="adjust(0,-100)" aria-label="Remove 100 from team 1">−</button> <strong id="s0">0</strong> <button onclick="adjust(0,100)" aria-label="Add 100 to team 1">+</button></div><div class="score">Team 2 <button onclick="adjust(1,-100)" aria-label="Remove 100 from team 2">−</button> <strong id="s1">0</strong> <button onclick="adjust(1,100)" aria-label="Add 100 to team 2">+</button></div></div></header><div class="toolbar"><button onclick="toggleStats()" id="statsBtn">Hide local survey questions</button><button onclick="resetGame()">Reset game</button><button onclick="document.documentElement.requestFullscreen?.()">Full screen</button></div><div id="board"></div><footer>Local survey questions use Humboldt County CHKS 2021–23 data. Percentages are rounded; 83% is calculated from reported past-month use. For classroom learning, not medical advice. In an emergency, call 911.</footer><div class="overlay" id="modal" role="dialog" aria-modal="true"><div class="panel"><div class="pill" id="catpill"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="answer hidden" id="answer"></div><div class="source hidden" id="cite"></div><div class="actions"><button onclick="reveal()" id="reveal">Reveal answer</button><button onclick="award(0)">Award Team 1</button><button onclick="award(1)">Award Team 2</button><button onclick="closeCard()">Back to board</button></div></div></div><script>const Q=[["Hot Takes","Is addiction only a matter of willpower?",["Yes, people can always stop at once","No, addiction can change the brain and behavior","Only for people who use daily","Only for illegal drugs"],1,"Substance use disorder is treatable. Blame and shame can make it harder to ask for help.","NIDA","https://nida.nih.gov/research-topics/addiction-science"],["Hot Takes","Must someone hit rock bottom before getting help?",["Yes, always","Only if they are an adult","No, help can begin at any time","Only after an overdose"],2,"Early help can prevent serious harm. People never need to wait for a crisis.","SAMHSA","https://www.samhsa.gov/find-help"],["Hot Takes","Can store-bought medicine cause poisoning?",["Yes, if misused or mixed with certain drugs","No, it is sold in stores","Only if it is expired","Only if it is a prescription"],0,"Over-the-counter medicines can cause harm if taken incorrectly. Check active ingredients.","FDA","https://www.fda.gov/drugs/information-drug-class/acetaminophen-information"],["Hot Takes","Does safer always mean safe?",["Yes, when friends are nearby","Yes, when a substance is tested","Only for adults","No, some risks remain"],3,"Harm reduction lowers risk but does not remove every danger.","NHRC","https://harmreduction.org/about-us/principles-of-harm-reduction/"],["Guess the %","Humboldt 9th graders: about how many had EVER used alcohol or drugs in 2021–23?",["17%","33%","49%","65%"],1,"33% reported ever using alcohol or drugs. Lifetime use does not mean current use.","Humboldt CHKS 2021–23 Table A9.2","https://data.calschls.org/resources/Humboldt_County_2123_Sec_CHKS.pdf",true],["Guess the %","Humboldt 11th graders: about how many had EVER used alcohol or drugs in 2021–23?",["25%","38%","50%","75%"],2,"50% reported ever using alcohol or drugs. This does not mean half use now.","Humboldt CHKS 2021–23 Table A9.2","https://data.calschls.org/resources/Humboldt_County_2123_Sec_CHKS.pdf",true],["Guess the %","Humboldt 7th graders: what percent reported alcohol or drug use in the past month?",["9%","19%","29%","39%"],0,"9% reported use in the past 30 days, not lifetime use.","Humboldt CHKS 2021–23 Table A9.5","https://data.calschls.org/resources/Humboldt_County_2123_Sec_CHKS.pdf",true],["Guess the %","Humboldt 9th graders: about how many reported NO alcohol or drug use in the past month?",["43%","63%","83%","93%"],2,"Approximately 83% reported no alcohol or drug use in the past 30 days, calculated as 100% minus the 17% reporting use.","Humboldt CHKS 2021–23 Table A9.5","https://data.calschls.org/resources/Humboldt_County_2123_Sec_CHKS.pdf",true],["Mix It Up","Do uppers and downers cancel each other out?",["Yes, if taken together","Yes, if the amounts match","Only with alcohol","No, risks can add up"],3,"Mixing substances can hide warning signs. Feeling alert does not mean someone is safe.","CDC","https://www.cdc.gov/overdose-prevention/"],["Mix It Up","What is one danger of mixing alcohol with opioid pills?",["Dangerously slow breathing","Better sleep without risk","A safer dose","Faster recovery"],0,"Both can slow breathing. Together they can raise overdose risk.","CDC","https://www.cdc.gov/overdose-prevention/"],["Mix It Up","Can two cold medicines have the same active ingredient?",["No, brands are always different","Yes, check both labels","Only if they have the same color","Only with a prescription"],1,"Some products share ingredients. Double dosing can be dangerous.","FDA","https://www.fda.gov/drugs/information-drug-class/acetaminophen-information"],["Mix It Up","A drug test says negative. Does that prove a substance is safe?",["Yes, it checks everything","Yes, if done twice","No, tests have limits","Only if it is a pill"],2,"A negative test cannot guarantee safety. Tests do not find every substance or danger.","CDC","https://www.cdc.gov/overdose-prevention/"],["Fentanyl Facts","Can brief skin contact with fentanyl powder usually cause an overdose?",["No, brief contact does not ordinarily cause overdose","Yes, it happens right away","Yes, if someone is nervous","Only if they are a teen"],0,"Brief skin contact does not ordinarily cause opioid overdose. Avoid contact and wash exposed skin.","ACMT","https://www.acmt.net/news/you-cant-overdose-on-fentanyl-just-by-touching-it-heres-what-experts-say/"],["Fentanyl Facts","Can a fake pill look like a real prescription pill?",["No, fake pills are always marked","Only if it is blue","Only if it is broken","Yes, looks alone cannot tell"],3,"Counterfeit pills can resemble real medicine. Appearance does not show what is inside.","DEA","https://www.dea.gov/onepill"],["Fentanyl Facts","Does naloxone (Narcan) reverse every kind of overdose?",["Yes, all drugs","No, it reverses opioid overdose","Yes, if given twice","Only alcohol poisoning"],1,"Naloxone reverses opioid overdose, not every poisoning. Call 911.","CDC","https://www.cdc.gov/overdose-prevention/reversing-overdose/about-naloxone.html"],["Fentanyl Facts","Someone wakes up after Narcan. What should you do?",["Let them sleep alone","Give them a drink","Still call 911 and stay with them","Tell them to drive home"],2,"Naloxone can wear off. Stay with the person and get emergency help.","CDC","https://www.cdc.gov/overdose-prevention/reversing-overdose/about-naloxone.html"]];const cats=["Hot Takes","Guess the %","Mix It Up","Fentanyl Facts"];let scores=[0,0],used=new Set(),current=null,selected=null,showStats=true;function adjust(t,n){scores[t]+=n;document.getElementById("s"+t).textContent=scores[t]}function render(){const b=document.getElementById("board");b.replaceChildren();cats.forEach((cat,i)=>{let e=document.createElement("div");e.className="cat";e.textContent=cat;b.appendChild(e)});for(let row=0;row<4;row++)for(let col=0;col<4;col++){let i=col*4+row,q=Q[i],e=document.createElement("button");e.className="tile";e.textContent=q[8]&&!showStats?"—":(row+1)*100;e.disabled=used.has(i)||(q[8]&&!showStats);e.onclick=()=>openCard(i);b.appendChild(e)}}function openCard(i){current=i;selected=null;let q=Q[i];document.getElementById("catpill").textContent=q[0]+" · "+(Math.floor(i%4)+1)*100+" POINTS";document.getElementById("question").textContent=q[1];let o=document.getElementById("options");o.replaceChildren();q[2].forEach((v,k)=>{let e=document.createElement("button");e.className="option";e.textContent=String.fromCharCode(65+k)+". "+v;e.onclick=()=>{selected=k;document.querySelectorAll(".option").forEach((b,j)=>b.classList.toggle("selected",j===k))};o.appendChild(e)});document.getElementById("answer").classList.add("hidden");document.getElementById("cite").classList.add("hidden");document.getElementById("reveal").disabled=false;document.getElementById("modal").classList.add("open")}function reveal(){if(current===null)return;let q=Q[current];document.querySelectorAll(".option").forEach((e,k)=>{e.classList.remove("selected");if(k===q[3])e.classList.add("correct");else if(selected===k)e.classList.add("wrong")});let a=document.getElementById("answer");a.textContent="Answer: "+q[2][q[3]]+". "+q[4];a.classList.remove("hidden");let c=document.getElementById("cite");c.replaceChildren(document.createTextNode("Source: "+q[5]+" · "));let link=document.createElement("a");link.href=q[6];link.target="_blank";link.rel="noopener";link.textContent="View source";c.appendChild(link);c.classList.remove("hidden");document.getElementById("reveal").disabled=true}function award(t){if(current===null)return;adjust(t,(current%4+1)*100);closeCard()}function closeCard(){if(current!==null)used.add(current);current=null;document.getElementById("modal").classList.remove("open");render()}function toggleStats(){showStats=!showStats;document.getElementById("statsBtn").textContent=showStats?"Hide local survey questions":"Show local survey questions";render()}function resetGame(){if(confirm("Reset all questions and scores?")){used.clear();scores=[0,0];document.getElementById("s0").textContent=0;document.getElementById("s1").textContent=0;render()}}render();</script></body></html>
